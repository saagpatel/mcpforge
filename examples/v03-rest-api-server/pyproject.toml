[project]
name = "customer-support-api"
version = "0.1.0"
description = "An MCP server that integrates with a customer support REST API to manage tickets, notes, service status, and triage workflows."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.0",

    "httpx",

]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "respx>=0.21.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
